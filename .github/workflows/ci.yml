name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        # Goldens are tagged and generated locally; pixel diffs across macOS/Linux
        # fonts make them flaky on CI, so exclude them from the default suite.
        run: flutter test --exclude-tags golden
      - name: Example pub get
        run: flutter pub get
        working-directory: example
      - name: Example analyze
        run: flutter analyze
        working-directory: example

  goldens:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Golden tests
        run: flutter test --tags golden

  pana:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Activate pana
        run: dart pub global activate pana
      - name: Run pana
        run: dart pub global run pana --exit-code-threshold 0
